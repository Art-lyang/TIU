    <div class="topbar-name">TURTLE ISLE<small>UNIVERSE</small></div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-status"><div class="t-dot"></div>SYSTEM ACTIVE</div>
</div>
<div id="ticker"><div class="tick-label">ORACLE</div><div class="tick-content"><span class="tick-inner" id="ticker-inner"></span></div></div>

<div class="page-wrap">
  <div class="page-hero">
    <div class="page-hero-eyebrow">DECLASSIFIED // INCIDENT ARCHIVES</div>
    <div class="page-hero-title">INCIDENT ARCHIVES</div>
    <div class="page-hero-desc">기밀 해제된 사건 보고서. 각 사건의 전개, 현장 기록, ORACLE 분석을 포함한다. 일부 기록은 보안 등급에 의해 편집되었다.</div>
  </div>

  <!-- Era filter tabs -->
  <div class="era-tabs" id="era-tabs">
    <div class="era-tab active" data-era="all">ALL</div>
    <div class="era-tab" data-era="2020s">2020s EVENTS</div>
    <div class="era-tab" data-era="2000s">2000s HISTORY</div>
  </div>

  <!-- Incident cards -->
  <div class="inc-grid" id="inc-grid"></div>
</div>

<!-- Incident Detail Modal -->
<div class="inc-overlay" id="inc-overlay">
  <div class="inc-modal" id="inc-modal"></div>
</div>

<script src="js/common-core.js"></script>
<script src="js/hero-canvas.js"></script>
<script src="js/incidents-data.js"></script>
<script>
function initIncidents(){
  const grid = document.getElementById('inc-grid');
  const tabs = document.getElementById('era-tabs');

  // render cards
  grid.innerHTML = INCIDENTS.map((inc,i)=>`
    <div class="inc-card t-${inc.threat}" data-era="${inc.era}" data-idx="${i}">
      <div>
        <div class="inc-code">${inc.code.split(' ').slice(-1)}</div>
      </div>
      <div class="inc-info">
        <div class="inc-title">${inc.title}</div>
        <div class="inc-date">${inc.id} // ${inc.date}</div>
        <div class="inc-summary">${inc.summary}</div>
      </div>
      <div class="inc-era-badge">${inc.era}</div>
    </div>
  `).join('');

  // card click → open modal
  grid.querySelectorAll('.inc-card').forEach(card=>{
    card.addEventListener('click',()=>openIncident(parseInt(card.dataset.idx)));
  });

  // era filter
  tabs.querySelectorAll('.era-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.querySelectorAll('.era-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const era = tab.dataset.era;
      grid.querySelectorAll('.inc-card').forEach(card=>{
        card.classList.toggle('hidden', era!=='all' && card.dataset.era!==era);
      });
    });
  });
}

function openIncident(idx){
  const inc = INCIDENTS[idx];
  const modal = document.getElementById('inc-modal');
  const overlay = document.getElementById('inc-overlay');

  const phasesHtml = inc.phases.map(p=>`
    <div class="inc-phase">
      <div class="inc-phase-name">${p.name}</div>
      <div class="inc-phase-time">${p.time}</div>
      <div class="inc-phase-text">${p.text}</div>
    </div>
  `).join('');

  const refsHtml = (inc.refs||[]).map(r=>`
    <a class="inc-ref" href="${r.href}"><span>→</span> ${r.text} <span class="inc-ref-page">${r.page}</span></a>
  `).join('');

  modal.innerHTML = `
    <div class="inc-modal-top">
      <div class="inc-modal-label">INCIDENT REPORT</div>
      <div class="inc-modal-close" onclick="closeIncident()">✕</div>
    </div>
    <div class="inc-modal-inner">
      <div class="inc-m-header">
        <div class="inc-m-code">${inc.code}</div>
        <div class="inc-m-title">${inc.title}</div>
        <div class="inc-m-quote">${inc.quote}</div>
        <div class="inc-m-meta">
          <span class="inc-m-tag">${inc.id}</span>
          <span class="inc-m-tag">${inc.era}</span>
          <span class="inc-m-tag">${inc.date}</span>
        </div>
      </div>

      ${phasesHtml}

      <div class="inc-oracle">
        <div class="inc-oracle-head">ORACLE // ANALYSIS</div>
        ${inc.oracle}
      </div>

      <div class="inc-impact">
        <div class="inc-impact-label">IMPACT ASSESSMENT</div>
        ${inc.impact}
      </div>

      ${refsHtml ? '<div class="inc-refs">'+refsHtml+'</div>' : ''}
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeIncident(){
  document.getElementById('inc-overlay').classList.remove('open');
  document.getElementById('inc-modal').innerHTML='';
  document.body.style.overflow='';
}

document.addEventListener('DOMContentLoaded',()=>{
  initIncidents();
  document.getElementById('inc-overlay').addEventListener('click',(e)=>{
    if(e.target===document.getElementById('inc-overlay')) closeIncident();
  });
});
</script>
