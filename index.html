<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIU — ORACLE GLOBAL OBSERVATION | KR-INIT-001</title>
  <meta name="description" content="ORACLE 전 지구 관측망. 접속하여 한국지부 KR-INIT-001 교본을 열람하십시오.">
  <link rel="stylesheet" href="./css/kor-init.css">
  <style>
    /* ── 인트로 전용 (이 페이지에서만 쓰는 스타일이라 인라인 유지) ── */
    .intro-body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#050607}
    .intro-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
    /* 지구 뒤 오라클 로고 워터마크 */
    .intro-stage::before{content:"";position:absolute;inset:0;background:url("./assets/brand/oracle-logo.png") center 42% / min(78vmin,700px) no-repeat;opacity:.08;filter:blur(1.2px) saturate(.6)}
    #globe{position:absolute;inset:0;width:100%;height:100%;display:block}
    .intro-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;z-index:3;font-family:var(--font-mono)}
    .intro-top .sig{font-size:.72rem;letter-spacing:.14em;color:rgba(245,241,232,.55)}
    .intro-top .sig strong{display:block;color:#f5f1e8;font-size:.86rem;letter-spacing:.1em}
    .intro-top .live{font-size:.68rem;letter-spacing:.12em;color:#4ade96;animation:introBlink 1.6s steps(2) infinite}
    @keyframes introBlink{50%{opacity:.35}}
    .intro-cta{position:absolute;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:3;padding:0 20px}
    .intro-title{margin:0;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.34em;color:rgba(245,241,232,.6);text-align:center}
    .access-btn{font-family:var(--font-mono);font-size:1rem;font-weight:700;letter-spacing:.22em;color:#4ade96;background:rgba(74,222,150,.06);border:1px solid rgba(74,222,150,.55);padding:16px 44px;min-height:54px;cursor:pointer;transition:background .2s,box-shadow .2s,color .2s}
    .access-btn:hover,.access-btn:focus-visible{background:rgba(74,222,150,.14);box-shadow:0 0 24px rgba(74,222,150,.25);outline:none}
    .access-btn.is-armed{color:#0a0f0c;background:#4ade96;box-shadow:0 0 34px rgba(74,222,150,.5)}
    .intro-skip{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;color:rgba(245,241,232,.4)}
    .intro-skip:hover{color:var(--ki-amber)}
    .intro-foot{position:absolute;bottom:10px;right:14px;z-index:3;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;color:rgba(245,241,232,.28)}
    .is-accessing .intro-cta,.is-accessing .intro-top{opacity:0;transition:opacity .8s ease}
    @media (prefers-reduced-motion: reduce){.intro-top .live{animation:none}}
  </style>
</head>
<body class="kor-init intro-body">
  <div class="noise-overlay" aria-hidden="true"></div>

  <div class="intro-stage">
    <canvas id="globe" aria-label="ORACLE 전 지구 관측망 지구본"></canvas>

    <div class="intro-top">
      <span class="sig"><strong>ORACLE</strong>GLOBAL OBSERVATION NETWORK</span>
      <span class="live">● LIVE FEED</span>
    </div>

    <div class="intro-cta">
      <p class="intro-title">KR-INIT-001 — KOREAN BRANCH TERMINAL</p>
      <button id="access" class="access-btn" type="button">ACCESS — 접속</button>
      <a class="intro-skip" href="./manual.html">연출 없이 바로 교본 열기 →</a>
    </div>

    <span class="intro-foot">CLASSIFIED DISTRIBUTION / SECURITY LV.3</span>
  </div>

  <script src="./js/globe-data.js"></script>
  <script src="./js/globe-intro.js"></script>
</body>
</html>
