  {id:'kr-lim',icon:'<img src="img/kr-lim-jaehyuk.png" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">',name:'임재혁',code:'CALLSIGN: SYS-01 — KR BRANCH TECHNICIAN',faction:'kr',fLabel:'KR BRANCH',bg:'#0a1510',desc:'기술관. ORACLE 단말기, 통신 보안, 시스템 관리 담당. ORACLE 아키텍처 비공개 레이어(5계층 이상)를 발견.',threat:'직위 박탈',status:'조우 시 제거 권고',loc:'한국 지부',notes:'ORACLE 아키텍처 외부에서 작동하는 프로세스를 포착. ORACLE 자신은 이 프로세스를 인식하지 못합니다.'},
];

const FACTIONS = [
  {key:'all',label:'ALL'},
  {key:'obs',label:'관측자'},
  {key:'pro',label:'프로메테우스'},
  {key:'she',label:'쉐드 오더'},
  {key:'kr',label:'한국 지부'},
  {key:'gov',label:'정부 · 군'},
  {key:'vil',label:'적대 세력'},
  {key:'civ',label:'민간인'},
];

function initProfiles(){
  // filters
  const filterRow = document.getElementById('pf-filters');
  filterRow.innerHTML = FACTIONS.map(f=>`<div class="pf-btn ${f.key==='all'?'active':''}" data-f="${f.key}">${f.label}</div>`).join('');
  filterRow.querySelectorAll('.pf-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      filterRow.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const f=btn.dataset.f;
      document.querySelectorAll('.prof-card').forEach(c=>{
        c.classList.toggle('hidden',f!=='all'&&c.dataset.faction!==f);
      });
      closeDetail();
    });
  });
  // grid
  const grid = document.getElementById('prof-grid');
  grid.innerHTML = PROFILES.map((p,i)=>`
    <div class="prof-card" data-faction="${p.faction}" data-idx="${i}">
      <div class="prof-avatar" style="background:linear-gradient(135deg,${p.bg},#000);">
        <span style="position:relative;z-index:1">${p.icon}</span>
      </div>
      <div class="prof-body">
        <div class="prof-name">${p.name}</div>
        <div class="prof-code">${p.code}</div>
        <div class="prof-badge ${p.faction}">${p.fLabel}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.prof-card').forEach(card=>{
    card.addEventListener('click',()=>openDetail(parseInt(card.dataset.idx)));
  });
}

function openDetail(idx){
  const p = PROFILES[idx];
  const d = document.getElementById('prof-detail');
  const overlay = document.getElementById('prof-overlay');
  // check if icon is an img tag or emoji
  const isImg = p.icon.startsWith('<img');
  const heroContent = isImg
    ? p.icon.replace(/style="[^"]*"/,'style="width:100%;height:100%;object-fit:cover;object-position:center 20%;"')
    : `<div class="pd-hero-emoji" style="background:linear-gradient(135deg,${p.bg},#000);">${p.icon}</div>`;
  d.innerHTML = `
    <div class="pd-close">
      <div class="pd-close-label">PERSONNEL PROFILE</div>
      <div class="pd-close-btn" onclick="closeDetail()">✕</div>
    </div>
    <div class="pd-hero" style="background:linear-gradient(135deg,${p.bg},#000);">
      ${heroContent}
      <div class="pd-hero-info">
        <div class="pd-name">${p.name}</div>
        <div class="pd-codename">${p.code}</div>
      </div>
    </div>
    <div class="pd-inner">
      <div class="pd-section">
        <div class="pd-label">FACTION</div>
        <span class="prof-badge ${p.faction}">${p.fLabel}</span>
      </div>
      <div class="pd-section">
        <div class="pd-label">DESCRIPTION</div>
        <div class="pd-text">${p.desc}</div>
      </div>
      <div class="pd-section">
        <div class="pd-label">STATUS</div>
        <div class="pd-stats">
          <div class="pd-stat"><b>THREAT</b><span>${p.threat}</span></div>
          <div class="pd-stat"><b>STATUS</b><span>${p.status}</span></div>
          <div class="pd-stat"><b>LOCATION</b><span>${p.loc}</span></div>
        </div>
      </div>
      <div class="pd-section">
        <div class="pd-label">NOTES</div>
        <div class="pd-text">${p.notes}</div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('prof-overlay').classList.remove('open');
  document.getElementById('prof-detail').innerHTML='';
  document.body.style.overflow='';
}

// close on overlay background click
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('prof-overlay').addEventListener('click',(e)=>{
    if(e.target === document.getElementById('prof-overlay')) closeDetail();
  });
});

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  initProfiles();
  
});
</script>
