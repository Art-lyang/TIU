<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACLE // 인물 프로파일</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/layout.css">
<style>
.page-wrap{padding-top:44px;padding-bottom:28px;}
.page-topnav{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid #1a1a1a;background:rgba(0,0,0,0.5);}
.page-back{font-size:11px;letter-spacing:2px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color 0.2s;}
.page-back:hover{color:var(--green);}
.page-breadcrumb{flex:1;text-align:center;font-size:9px;letter-spacing:4px;color:var(--muted);}
.page-hero{padding:40px 20px 32px;position:relative;}
.page-hero::after{content:'';position:absolute;bottom:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,160,0.1),transparent);}
.page-hero-eyebrow{font-size:9px;letter-spacing:5px;color:var(--muted);margin-bottom:6px;padding-left:12px;border-left:2px solid var(--green);}
.page-hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,8vw,52px);color:var(--white);letter-spacing:2px;margin-bottom:8px;}
.page-hero-desc{font-size:12px;color:var(--light);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.8;max-width:600px;}



/* profile filters */
.pf-row{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.pf-btn{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  padding:6px 12px;background:var(--card);border:1px solid #1e1e1e;
  color:var(--muted);cursor:pointer;transition:all 0.15s;
}
.pf-btn:hover{border-color:var(--green);color:var(--light);}
.pf-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,229,160,0.06);}

/* profile grid */
.prof-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.prof-card{
  background:var(--card);border:1px solid #1e1e1e;overflow:hidden;
  cursor:pointer;transition:border-color 0.2s;position:relative;
}
.prof-card:hover{border-color:var(--green);}
.prof-card.hidden{display:none;}
.prof-avatar{
  height:160px;display:flex;align-items:center;justify-content:center;
  font-size:32px;position:relative;overflow:hidden;
}
.prof-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
.prof-avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,var(--card));}
.prof-body{padding:10px 12px;}
.prof-name{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:var(--white);margin-bottom:3px;}
.prof-code{font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
.prof-badge{
  display:inline-block;font-size:8px;letter-spacing:1.5px;
  padding:2px 7px;border:1px solid;
}
.prof-badge.obs{border-color:var(--green);color:var(--green);}
.prof-badge.pro{border-color:var(--amber);color:var(--amber);}
.prof-badge.she{border-color:var(--red);color:var(--red);}
.prof-badge.tsw{border-color:var(--blue);color:var(--blue);}
.prof-badge.civ{border-color:var(--light);color:var(--light);}
.prof-badge.gov{border-color:#8888ff;color:#8888ff;}

/* profile detail — modal/popup overlay */
.prof-detail-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.prof-detail-overlay.open{display:flex;}
.prof-detail-modal{
  background:var(--bg);border:1px solid var(--green);
  width:100%;max-width:560px;max-height:85vh;
  overflow-y:auto;position:relative;
  animation:modalUp 0.25s ease;
}
@keyframes modalUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.pd-close{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--bg);border-bottom:1px solid #1e1e1e;
}
.pd-close-label{font-size:9px;letter-spacing:4px;color:var(--muted);}
.pd-close-btn{font-size:18px;color:var(--muted);cursor:pointer;transition:color 0.15s;line-height:1;}
.pd-close-btn:hover{color:var(--white);}
.pd-hero{position:relative;height:180px;overflow:hidden;}
.pd-hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
.pd-hero-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;}
.pd-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg));}
.pd-hero-info{position:absolute;bottom:12px;left:16px;z-index:2;}
.pd-name{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--white);letter-spacing:2px;line-height:1;}
.pd-codename{font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:4px;}
.pd-inner{padding:16px;}
.pd-section{margin-bottom:14px;}
.pd-label{font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1a1a1a;}
.pd-text{font-size:13px;color:var(--light);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:2.0;}
.pd-stats{display:flex;gap:4px;}
.pd-stat{flex:1;padding:8px;background:#0d0d0d;border:1px solid #1a1a1a;text-align:center;}
.pd-stat b{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:3px;font-weight:400;}
.pd-stat span{font-size:11px;color:var(--white);}
@media(min-width:900px){
  .pd-hero{height:240px;}
  .pd-name{font-size:36px;}
  .pd-text{font-size:13px;line-height:2.1;}
  .prof-detail-modal{max-width:640px;}
}

/* codex */
.codex-search{margin-bottom:12px;}
.codex-input{
  width:100%;background:#0d0d0d;border:1px solid #1e1e1e;
  color:var(--green);font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:1px;padding:10px 14px;outline:none;
  transition:border-color 0.2s;
}
.codex-input::placeholder{color:var(--muted);}
.codex-input:focus{border-color:var(--green);}
.codex-count{font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:10px;}
.codex-item{
  border:1px solid #1e1e1e;background:var(--card);margin-bottom:2px;
  padding:14px;cursor:pointer;transition:border-color 0.15s;
}
.codex-item:hover{border-color:var(--green);}
.codex-item.hidden{display:none;}
.codex-term{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;color:var(--white);margin-bottom:3px;}
.codex-en{font-size:9px;letter-spacing:2px;color:var(--green);margin-bottom:6px;}
.codex-def{font-size:12px;color:var(--light);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.7;display:none;}
.codex-item.open .codex-def{display:block;}
.codex-cat{display:inline-block;font-size:8px;letter-spacing:1.5px;padding:2px 6px;border:1px solid #2a2a2a;color:var(--muted);margin-top:6px;}

@media(min-width:900px){
  .page-wrap{max-width:1100px;margin:0 auto;}
  .prof-grid{grid-template-columns:repeat(3,1fr);}
  .prof-avatar{height:180px;}
  .codex-list{columns:2;column-gap:4px;}
  .codex-item{break-inside:avoid;}
}
@media(min-width:1200px){
  .prof-grid{grid-template-columns:repeat(4,1fr);}
  .prof-avatar{height:200px;}
}

.xref{display:flex;flex-direction:column;gap:2px;margin:12px 0;}
.xref-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#080808;border:1px solid #1a1a1a;text-decoration:none;color:var(--light);font-size:11px;transition:border-color 0.15s;}
.xref-item:hover{border-color:var(--green);}
.xref-arrow{color:var(--muted);font-size:14px;}
.xref-page{font-size:8px;letter-spacing:2px;color:var(--muted);}


</style>
</head>

<script>


// ── PROFILE DATA ──
const PROFILES = [
  {id:'seraph',icon:'👁',name:'SERAPH-NULL',code:'OBSERVER OUTPUT FORM',faction:'obs',fLabel:'OBSERVER',bg:'#001a0d',desc:'██████████ 물리 공간에 직접 개입할 때 사용하는 형태. ██████████ 가능한 유일한 출력체. PROTOCOL: ██████████에서 최초 출현.',threat:'극도 위험',status:'활성',loc:'불명',notes:'인간과의 접촉 시 대상의 인지 구조가 ██████████ 가능성이 있음. [OBSERVER — 자체 보안 검열]'},

  {id:'ares',icon:'🦅',name:'ARES Division 국장',code:'US MILITARY — CLASSIFIED',faction:'gov',fLabel:'GOVERNMENT',bg:'#0d0d14',desc:'미국 ARES Division의 최고 지휘관. 기술 우위와 위성 전쟁 능력을 기반으로 글로벌 군사 대응을 주도.',threat:'아군',status:'활동 중',loc:'미국',notes:'캐릭터 디자인 완성 시 상세 정보 업데이트 예정.'},
  {id:'civ1',icon:'👤',name:'미공개 인물',code:'FIRST INTERFACE PARTICIPANT',faction:'civ',fLabel:'CIVILIAN',bg:'#111',desc:'██████████ ↔ 인간 최초 대화 (FIRST INTERFACE)에 참여한 민간인. 정체는 미공개.',threat:'없음',status:'생존',loc:'한국 추정',notes:'PROJECT: FIRST CHOICE의 핵심 변수. 캐릭터 공개 예정.'},

const FACTIONS = [
  {key:'all',label:'ALL'},
  {key:'obs',label:'관측자'},
  {key:'pro',label:'프로메테우스'},
  {key:'she',label:'쉐드 오더'},
  {key:'tsw',label:'TS-Ω'},
  {key:'gov',label:'정부 · 군'},
  {key:'civ',label:'민간인'},
];

function initProfiles(){
  // filters
  const filterRow = document.getElementById('pf-filters');
  filterRow.innerHTML = FACTIONS.map(f=>`<div class="pf-btn ${f.key==='all'?'active':''}" data-f="${f.key}">${f.label}</div>`).join('');
  filterRow.querySelectorAll('.pf-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      filterRow.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const f=btn.dataset.f;
      document.querySelectorAll('.prof-card').forEach(c=>{
        c.classList.toggle('hidden',f!=='all'&&c.dataset.faction!==f);
      });
      closeDetail();
    });
  });
  // grid
  const grid = document.getElementById('prof-grid');
  grid.innerHTML = PROFILES.map((p,i)=>`
    <div class="prof-card" data-faction="${p.faction}" data-idx="${i}">
      <div class="prof-avatar" style="background:linear-gradient(135deg,${p.bg},#000);">
        <span style="position:relative;z-index:1">${p.icon}</span>
      </div>
      <div class="prof-body">
        <div class="prof-name">${p.name}</div>
        <div class="prof-code">${p.code}</div>
        <div class="prof-badge ${p.faction}">${p.fLabel}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.prof-card').forEach(card=>{
    card.addEventListener('click',()=>openDetail(parseInt(card.dataset.idx)));
  });
}

function openDetail(idx){
  const p = PROFILES[idx];
  const d = document.getElementById('prof-detail');
  const overlay = document.getElementById('prof-overlay');
  // check if icon is an img tag or emoji
  const isImg = p.icon.startsWith('<img');
  const heroContent = isImg
    ? p.icon.replace(/style="[^"]*"/,'style="width:100%;height:100%;object-fit:cover;object-position:center 20%;"')
    : `<div class="pd-hero-emoji" style="background:linear-gradient(135deg,${p.bg},#000);">${p.icon}</div>`;
  d.innerHTML = `
    <div class="pd-close">
      <div class="pd-close-label">PERSONNEL PROFILE</div>
      <div class="pd-close-btn" onclick="closeDetail()">✕</div>
    </div>
    <div class="pd-hero" style="background:linear-gradient(135deg,${p.bg},#000);">
      ${heroContent}
      <div class="pd-hero-info">
        <div class="pd-name">${p.name}</div>
        <div class="pd-codename">${p.code}</div>
      </div>
    </div>
    <div class="pd-inner">
      <div class="pd-section">
        <div class="pd-label">FACTION</div>
        <span class="prof-badge ${p.faction}">${p.fLabel}</span>
      </div>
      <div class="pd-section">
        <div class="pd-label">DESCRIPTION</div>
        <div class="pd-text">${p.desc}</div>
      </div>
      <div class="pd-section">
        <div class="pd-label">STATUS</div>
        <div class="pd-stats">
          <div class="pd-stat"><b>THREAT</b><span>${p.threat}</span></div>
          <div class="pd-stat"><b>STATUS</b><span>${p.status}</span></div>
          <div class="pd-stat"><b>LOCATION</b><span>${p.loc}</span></div>
        </div>
      </div>
      <div class="pd-section">
        <div class="pd-label">NOTES</div>
        <div class="pd-text">${p.notes}</div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('prof-overlay').classList.remove('open');
  document.getElementById('prof-detail').innerHTML='';
  document.body.style.overflow='';
}

// close on overlay background click
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('prof-overlay').addEventListener('click',(e)=>{
    if(e.target === document.getElementById('prof-overlay')) closeDetail();
  });
});

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  initProfiles();
  
});
</script>
